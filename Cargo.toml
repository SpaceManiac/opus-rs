[package]
name = "opus"
version = "0.4.0"
authors = ["Tad Hardesty <tad@platymuus.com>"]

description = "Safe Rust bindings for libopus"
readme = "README.md"
license = "MIT/Apache-2.0"
keywords = ["opus", "codec", "voice", "sound", "audio"]
categories = [
    "api-bindings",
    "encoding",
    "compression",
    "multimedia::audio",
    "multimedia::encoding",
]

repository = "https://github.com/SpaceManiac/opus-rs"

edition = "2015"

[features]
default = ["bundled"]
# Used internally by 'opusic-sys' to generate lib.rs
build-bindgen = ["opusic-sys/build-bindgen"]
# enable DRED
dred = ["opusic-sys/dred"]
# enable OSCE
osce = ["opusic-sys/osce"]
# disable run-time checks that are cheap and safe for use in production.
no-hardening = ["opusic-sys/no-hardening"]
# disable stack protection.
no-stack-protector = ["opusic-sys/no-stack-protector"]
# disable protection against buffer overflows.
no-fortify-source = ["opusic-sys/no-fortify-source"]
# disable SIMD optimizations
no-simd = ["opusic-sys/no-simd"]
# fixed point for MCUs with no FPU
fixed-point = ["opusic-sys/fixed-point"]
# bundle "libopus" instead of dynamic linking
bundled = ["opusic-sys/bundled"]

[dependencies.opusic-sys]
version = "0.7.3"
default-features = false
